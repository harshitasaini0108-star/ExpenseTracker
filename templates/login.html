<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Expense Tracker</title>

<!-- Bootstrap 5 & FontAwesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<!-- Pro Animations CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: #0b1120;
    color: white;
    position: relative;
    padding: 20px;
}

/* Glass Card */
.login-card {
    width: 100%;
    max-width: 460px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 32px;
    padding: 42px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 10;
}

.logo-badge {
    width: 80px;
    height: 80px;
    border-radius: 24px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    margin: 0 auto 20px auto;
    box-shadow: 0 12px 25px rgba(59, 130, 246, 0.35);
}

.form-label {
    font-size: 14px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 8px;
}

.input-group {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.12);
    transition: all 0.25s var(--ease-smooth);
    background: rgba(15, 23, 42, 0.6);
}

.input-group:focus-within {
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
}

.input-group-text {
    background: transparent;
    border: none;
    color: #94a3b8;
    padding-left: 16px;
}

.form-control {
    background: transparent;
    border: none;
    color: white;
    padding: 14px 14px 14px 10px;
}

.form-control:focus {
    background: transparent;
    color: white;
    box-shadow: none;
}

.form-control::placeholder {
    color: #64748b;
}

.btn-login {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-weight: 600;
    color: white;
    box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
    transition: all 0.25s ease;
}

.btn-login:hover {
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
    color: white;
}

.register-link a {
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.2s ease;
}

.register-link a:hover {
    color: #93c5fd;
    text-decoration: underline;
}
</style>
</head>

<body>

<!-- Ambient Glowing Orbs -->
<div class="ambient-orb ambient-orb-1"></div>
<div class="ambient-orb ambient-orb-2"></div>
<div class="ambient-orb ambient-orb-3"></div>

<!-- Interactive Particle Canvas -->
<canvas id="bg-canvas"></canvas>

<div class="login-card reveal" data-tilt>

    <!-- Logo & Header -->
    <div class="text-center mb-4">
        <div class="logo-badge">
            💎
        </div>
        <h2 class="fw-bold mb-1">Welcome Back</h2>
        <p class="text-secondary small">Sign in to your Expense Tracker account</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show mb-4">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST" action="/login">

        <div class="mb-3">
            <label class="form-label">
                <i class="fa-solid fa-envelope me-1"></i> Email Address
            </label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-at"></i>
                </span>
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="name@example.com"
                    required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">
                <i class="fa-solid fa-lock me-1"></i> Password
            </label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="fa-solid fa-key"></i>
                </span>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>
                <button
                    type="button"
                    class="input-group-text"
                    style="cursor: pointer;"
                    onclick="togglePassword()">
                    <i id="eye" class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button
            type="submit"
            class="btn btn-login w-100 btn-pulse"
            data-loading-text="Authenticating...">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Login Now
        </button>

    </form>

    <div class="text-center mt-4 register-link">
        <p class="text-secondary mb-2">
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>
        <p class="text-secondary small mb-0">
            <a href="/" class="text-muted"><i class="fa-solid fa-house me-1"></i> Back to Home</a>
        </p>
    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="{{ url_for('static', filename='js/animations.js') }}" defer></script>

<script>
function togglePassword() {
    const password = document.getElementById("password");
    const eye = document.getElementById("eye");

    if (password.type === "password") {
        password.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        password.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
