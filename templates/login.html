<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Expense Tracker</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;

    background:linear-gradient(
        -45deg,
        #667eea,
        #764ba2,
        #6dd5ed,
        #00c9ff
    );

    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Shapes */

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(10px);
    opacity:.4;
}

.circle1{
    width:250px;
    height:250px;
    background:#ff9a9e;
    top:-50px;
    left:-50px;
}

.circle2{
    width:300px;
    height:300px;
    background:#a18cd1;
    bottom:-80px;
    right:-80px;
}

.circle3{
    width:180px;
    height:180px;
    background:#84fab0;
    top:50%;
    left:10%;
}

/* Login Card */

.login-card{
    width:100%;
    max-width:480px;

    background:rgba(255,255,255,.15);
    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:35px;
    padding:40px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.25);

    color:white;

    position:relative;
    z-index:100;
}

/* Logo */

.logo{
    width:110px;
    height:110px;

    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:45px;

    background:linear-gradient(
        135deg,
        #ffecd2,
        #fcb69f
    );

    color:#222;

    box-shadow:
    0 0 40px rgba(255,255,255,.4);
}

h2{
    font-weight:700;
}

/* Input */

.form-label{
    font-weight:600;
}

.input-group{
    border-radius:15px;
    overflow:hidden;
}

.form-control{
    border:none;
    padding:14px;
}

.form-control:focus{
    box-shadow:none;
}

.input-group-text{
    border:none;
    background:white;
}

/* Button */

.btn-login{
    border:none;
    padding:14px;

    border-radius:15px;

    font-size:17px;
    font-weight:700;

    background:linear-gradient(
        135deg,
        #ffb347,
        #ffcc33
    );

    color:#222;

    transition:.3s;
}

.btn-login:hover{
    transform:translateY(-3px);
}

/* Footer */

.register-link a{
    color:#fff;
    font-weight:600;
}

.register-link a:hover{
    color:#ffd700;
}

.alert{
    border-radius:15px;
}

</style>
</head>
<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="login-card">

    <div class="text-center">

        <div class="logo">
            💰
        </div>

        <h2 class="mt-4">
            Welcome Back
        </h2>

        <p class="mb-4">
            Sign in to manage your expenses
        </p>

    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                <i class="fa-solid fa-envelope"></i>
                Email Address
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa-solid fa-envelope"></i>
                </span>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter email"
                    required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">
                <i class="fa-solid fa-lock"></i>
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

                <button
                    type="button"
                    class="input-group-text"
                    onclick="togglePassword()">

                    <i id="eye" class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-login w-100">

            <i class="fa-solid fa-right-to-bracket"></i>
            Login Now

        </button>

    </form>

    <div class="text-center mt-4 register-link">

        <p>
            Don't have an account?

            <a href="/register">
                Create Account
            </a>
        </p>

    </div>

</div>

<script>

function togglePassword(){

    const password =
    document.getElementById("password");

    const eye =
    document.getElementById("eye");

    if(password.type==="password"){
        password.type="text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    }else{
        password.type="password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}

</script>

</body>
</html>
