<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense | Expense Tracker</title>

<!-- Bootstrap 5 & FontAwesome -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<!-- Pro Animations CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

<style>
body {
    min-height: 100vh;
    background-color: #0b1120;
    color: white;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 40px 0;
}

.expense-card {
    max-width: 820px;
    margin: auto;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 32px;
    padding: 40px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 10;
}

.icon-box {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px auto;
    border-radius: 26px;
    background: linear-gradient(135deg, #ec4899, #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: white;
    box-shadow: 0 12px 25px rgba(236, 72, 153, 0.35);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.info-box {
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 24px;
}

.amount-preview {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #38bdf8;
    transition: transform 0.2s ease;
}

.form-label {
    font-size: 14px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 8px;
}

.form-control, .form-select {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 14px 18px;
    color: white;
}

.form-control:focus, .form-select:focus {
    background: rgba(15, 23, 42, 0.85);
    color: white;
    border-color: #38bdf8;
}

.form-control::placeholder {
    color: #64748b;
}

.form-select option {
    background: #1e293b;
    color: white;
}

.btn-save {
    background: linear-gradient(135deg, #f59e0b, #ea580c);
    border: none;
    border-radius: 14px;
    padding: 14px;
    font-weight: 600;
    color: white;
    box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
}

.btn-save:hover {
    background: linear-gradient(135deg, #d97706, #c2410c);
    color: white;
}
</style>
</head>

<body>

<!-- Ambient Glowing Orbs -->
<div class="ambient-orb ambient-orb-1"></div>
<div class="ambient-orb ambient-orb-2"></div>

<!-- Interactive Particle Canvas -->
<canvas id="bg-canvas"></canvas>

<div class="container">

    <div class="expense-card reveal" data-tilt>

        <!-- Top Actions -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-arrow-left me-1"></i> Dashboard
            </a>
            <a href="/view_expenses" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="fa-solid fa-list me-1"></i> View All
            </a>
        </div>

        <div class="text-center mb-4">
            <div class="icon-box">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h2 class="fw-bold mb-1">Add New Expense</h2>
            <p class="text-secondary small">
                Record your daily spending and keep your budget organized
            </p>
        </div>

        <!-- Real-Time Interactive Preview Box -->
        <div class="info-box mb-4">
            <div class="row align-items-center">
                <div class="col-md-6 text-center border-end border-secondary border-opacity-25 py-2">
                    <small class="text-uppercase text-secondary fw-semibold">Monthly Budget</small>
                    <h3 class="fw-bold mt-1 mb-0" data-count="{{ budget }}" data-prefix="₹ ">₹ {{ budget }}</h3>
                </div>
                <div class="col-md-6 text-center py-2">
                    <small class="text-uppercase text-secondary fw-semibold">Live Expense Preview</small>
                    <div class="amount-preview mt-1">
                        ₹ 0
                    </div>
                </div>
            </div>
        </div>

        <!-- Form -->
        <form method="POST" action="/add_expense">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">
                        <i class="fa-solid fa-layer-group me-1"></i> Category
                    </label>
                    <select name="category" id="category" class="form-select" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Travel">🚗 Travel & Fuel</option>
                        <option value="Bills">💡 Utilities & Bills</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Health">🏥 Health & Medical</option>
                        <option value="Education">📚 Education</option>
                        <option value="Groceries">🛒 Groceries</option>
                        <option value="Other">📦 Other Expenses</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">
                        <i class="fa-solid fa-indian-rupee-sign me-1"></i> Amount (₹)
                    </label>
                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        id="amount"
                        class="form-control"
                        placeholder="e.g. 750"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    <i class="fa-solid fa-pen-to-square me-1"></i> Description
                </label>
                <textarea
                    name="description"
                    id="description"
                    rows="3"
                    class="form-control"
                    placeholder="What did you spend on? (e.g., Grocery shopping at supermarket)"
                    required></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    <i class="fa-solid fa-calendar me-1"></i> Date of Expense
                </label>
                <input
                    type="date"
                    name="date"
                    id="expense_date"
                    class="form-control"
                    required>
            </div>

            <button
                type="submit"
                class="btn btn-save w-100 btn-pulse"
                data-loading-text="Saving Expense...">
                <i class="fa-solid fa-check me-2"></i> Save Expense
            </button>

        </form>

    </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="{{ url_for('static', filename='js/animations.js') }}" defer></script>

<script>
// Automatically set date picker to today's date if empty
document.addEventListener('DOMContentLoaded', () => {
    const dateInput = document.getElementById('expense_date');
    if (dateInput && !dateInput.value) {
        dateInput.value = new Date().toISOString().split('T')[0];
    }
});
</script>

</body>
</html>
