<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Expense</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#06b6d4);
    font-family:'Segoe UI',sans-serif;
}

.expense-card{
    max-width:850px;
    margin:auto;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    border-radius:30px;
    padding:35px;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
    color:white;
}

.form-control,
.form-select{
    border:none;
    border-radius:15px;
    padding:14px;
}

.form-control:focus,
.form-select:focus{
    box-shadow:0 0 15px rgba(255,255,255,.3);
}

.icon-box{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:linear-gradient(135deg,#f093fb,#f5576c);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    color:white;
}

.info-box{
    background:rgba(255,255,255,.10);
    border-radius:20px;
    padding:20px;
}

.btn-custom{
    border-radius:15px;
    padding:12px;
    font-weight:600;
}

.amount-preview{
    font-size:32px;
    font-weight:700;
}

</style>
</head>

<body>

<div class="container py-5">

<div class="expense-card">

    <div class="text-center">

        <div class="icon-box">
            <i class="fa-solid fa-wallet"></i>
        </div>

        <h2 class="mt-3">
            Add New Expense
        </h2>

        <p>
            Record your daily spending and track finances smarter.
        </p>

    </div>

    <!-- Budget Card -->

    <div class="info-box mt-4">

        <div class="row">

            <div class="col-md-6 text-center">
                <h5>Monthly Budget</h5>
                <h3>₹ {{ budget }}</h3>
            </div>

            <div class="col-md-6 text-center">
                <h5>Current Entry</h5>
                <div id="previewAmount" class="amount-preview">
                    ₹ 0
                </div>
            </div>

        </div>

    </div>

    <!-- Form -->

    <form method="POST" class="mt-4">

        <div class="mb-3">
            <label class="mb-2">
                <i class="fa-solid fa-layer-group"></i>
                Category
            </label>

            <select name="category" class="form-select" required>

    <option value="">Select Category</option>

    <option value="Food">🍔 Food</option>
    <option value="Shopping">🛒 Shopping</option>
    <option value="Travel">🚗 Travel</option>
    <option value="Bills">💡 Bills</option>
    <option value="Entertainment">🎬 Entertainment</option>
    <option value="Health">🏥 Health</option>
    <option value="Education">📚 Education</option>
    <option value="Other">📦 Other</option>

</select>
        </div>

        <div class="mb-3">
            <label class="mb-2">
                <i class="fa-solid fa-indian-rupee-sign"></i>
                Amount
            </label>

            <input
                type="number"
                name="amount"
                id="amount"
                class="form-control"
                placeholder="Enter Amount"
                required>
        </div>

        <div class="mb-3">
            <label class="mb-2">
                <i class="fa-solid fa-pen"></i>
                Description
            </label>

            <textarea
                name="description"
                rows="3"
                class="form-control"
                placeholder="Expense Description"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="mb-2">
                <i class="fa-solid fa-calendar"></i>
                Date
            </label>

            <input
                type="date"
                name="date"
                class="form-control"
                required>
        </div>

        <button
            type="submit"
            class="btn btn-warning w-100 btn-custom">

            <i class="fa-solid fa-plus"></i>
            Save Expense

        </button>

    </form>

    <div class="row mt-3">

        <div class="col-md-6">
            <a href="/dashboard"
               class="btn btn-dark w-100 btn-custom">

                Dashboard

            </a>
        </div>

        <div class="col-md-6">
            <a href="/view_expenses"
               class="btn btn-success w-100 btn-custom">

                View Expenses

            </a>
        </div>

    </div>

</div>

</div>

<script>

const amountInput =
document.getElementById("amount");

const preview =
document.getElementById("previewAmount");

amountInput.addEventListener("input", () => {

    preview.innerText =
    "₹ " + (amountInput.value || 0);

});

</script>

</body>
</html>
