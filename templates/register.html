<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;

    background:linear-gradient(
        -45deg,
        #667eea,
        #764ba2,
        #6dd5ed,
        #2193b0
    );

    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.glass-card{
    width:100%;
    max-width:500px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:30px;

    padding:40px;

    color:white;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;

    margin:auto;

    background:linear-gradient(
        135deg,
        #ff9a9e,
        #fad0c4
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:35px;
    color:#222;
}

.form-control{
    border:none;
    border-radius:15px;
    padding:14px;
}

.form-control:focus{
    box-shadow:none;
}

.btn-register{
    background:linear-gradient(
        135deg,
        #ff9966,
        #ff5e62
    );

    border:none;
    border-radius:15px;

    padding:12px;

    font-weight:600;
    color:white;
}

.btn-register:hover{
    transform:translateY(-2px);
}

.input-group-text{
    border:none;
    background:white;
}

.login-link{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.login-link:hover{
    color:#ffe082;
}

</style>
</head>

<body>

<div class="glass-card">

    <div class="text-center mb-4">

        <div class="logo">
            💰
        </div>

        <h2 class="mt-3 fw-bold">
            Create Account
        </h2>

        <p class="text-light">
            Join Expense Tracker Today
        </p>

    </div>

    <form method="POST">

        <div class="mb-3">

            <label class="mb-2">
                Full Name
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa-solid fa-user"></i>
                </span>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter your name"
                    required>

            </div>

        </div>

        <div class="mb-3">

            <label class="mb-2">
                Email Address
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa-solid fa-envelope"></i>
                </span>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>

        </div>

        <div class="mb-4">

            <label class="mb-2">
                Password
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="fa-solid fa-lock"></i>
                </span>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Create password"
                    required>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-register w-100">

            <i class="fa-solid fa-user-plus"></i>
            Create Account

        </button>

    </form>

    <div class="text-center mt-4">

        Already have an account?

        <a href="/login" class="login-link">
            Login Here
        </a>

    </div>

</div>

</body>
</html>
